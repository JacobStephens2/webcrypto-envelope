name: Release

# Publishes to npm via Trusted Publishing (OIDC), no long-lived tokens.
# The package's Trusted Publisher on npm points at this repo + workflow,
# which is what the id-token: write permission below binds to.
# https://docs.npmjs.com/trusted-publishers/
# https://docs.npmjs.com/generating-provenance-statements
#
# Triggered when a v* tag is pushed:
#   git tag v0.1.1 && git push --tags

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write        # for creating the GitHub Release
  id-token: write        # for npm OIDC (provenance + trusted publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1. Verify the preinstalled
      # npm rather than installing npm@latest so a runner image change fails
      # fast instead of running an unpinned install.
      - name: Ensure npm >= 11.5.1 for Trusted Publishing
        run: |
          set -eu
          npm_version=$(npm --version)
          node -e '
            const raw = process.argv[1].trim();
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(raw);
            if (!match) {
              console.error(`Expected semver from npm --version, got: ${raw}`);
              process.exit(1);
            }
            const [major, minor, patch] = match.slice(1, 4).map(Number);
            const prerelease = match[4];
            const min = [11, 5, 1];
            const cmp = [major - min[0], minor - min[1], patch - min[2]].find((d) => d !== 0) ?? 0;
            if (cmp < 0 || (cmp === 0 && prerelease !== undefined)) {
              console.error(`npm >= 11.5.1 required for Trusted Publishing, got ${raw}`);
              process.exit(1);
            }
            console.log(`npm ${raw} satisfies >= 11.5.1`);
          ' "$npm_version"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish to npm (OIDC, provenance)
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
